name: banking-agent-public

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - public_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - public_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    env_file:
      - .env.public
    environment:
      APP_ENV: production
      PUBLIC_DEMO_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: https://${PUBLIC_DOMAIN}
      PUBLIC_WEB_BASE_URL: https://${PUBLIC_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 8

  web:
    build:
      context: ./apps/web
      args:
        INTERNAL_API_BASE_URL: http://api:8000
        NEXT_PUBLIC_REQUIRE_INVITE: "true"
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - public_caddy_data:/data
      - public_caddy_config:/config
    depends_on:
      - web

volumes:
  public_postgres_data:
  public_redis_data:
  public_caddy_data:
  public_caddy_config:
